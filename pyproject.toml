[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-work"
version = "0.1.0"
description = "Terminal visualization of Jev repository context selection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jc = "jc.cli:main"

[tool.setuptools.packages.find]
include = ["jc*"]

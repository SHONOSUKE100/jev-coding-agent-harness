[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-work"
version = "0.2.0"
description = "Terminal visualization of Jev repository context selection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jc = "jc.cli:main"
jc-search = "jc.cli:search_main"
jc-read = "jc.cli:read_main"
jc-symbol = "jc.cli:symbol_main"

[tool.setuptools.packages.find]
include = ["jc*"]
